<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="gradGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#8b5cf6" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="14" fill="#090e1a"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#favGrad)" stroke-width="2" stroke-opacity="0.8"/>
  
  <!-- Stylized Gradient Sphere / Swatch with multi-stop color blend -->
  <g filter="url(#gradGlow)">
    <circle cx="32" cy="32" r="18" fill="url(#favGrad)"/>
    <circle cx="32" cy="32" r="17" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>
    
    <!-- Sparkles -->
    <path d="M46 16 L47.5 20.5 L52 22 L47.5 23.5 L46 28 L44.5 23.5 L40 22 L44.5 20.5 Z" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
